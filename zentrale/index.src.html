<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Zentrale</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007AFF'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
<!-- Quelle der Zentrale. bauen.py setzt die Symbole (Lucide) ein und schreibt index.html. -->
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--grp:#FFFFFF;--grp2:#FFFFFF;--sheet:#F2F2F7;--segon:#FFFFFF;
  --ink:#1D1D1F;--ink2:#86868B;--ink3:#C7C7CC;--sep:rgba(60,60,67,.16);--fill:rgba(120,120,128,.13);--hover:rgba(0,0,0,.035);
  --blue:#007AFF;--green:#34C759;--orange:#FF9500;--red:#FF3B30;--purple:#AF52DE;--teal:#30B0C7;--indigo:#5856D6;
  --pink:#FF2D55;--cyan:#32ADE6;--gray:#8E8E93;--yellow:#FFCC00;--mint:#00C7BE;--brown:#A2845E;
  --warnink:#C93400;--badink:#D70015;
  --shadow:0 1px 1px rgba(0,0,0,.03),0 6px 24px rgba(0,0,0,.05);--shadow2:0 2px 4px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.09);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --round:"SF Pro Rounded",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000;--card:#1C1C1E;--grp:#1C1C1E;--grp2:#2C2C2E;--sheet:#1C1C1E;--segon:#636366;
  --ink:#F5F5F7;--ink2:#98989D;--ink3:#48484A;--sep:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--hover:rgba(255,255,255,.05);
  --blue:#0A84FF;--green:#30D158;--orange:#FF9F0A;--red:#FF453A;--purple:#BF5AF2;--teal:#40C8E0;--indigo:#5E5CE6;
  --pink:#FF375F;--cyan:#64D2FF;--gray:#98989D;--yellow:#FFD60A;--mint:#63E6E2;--brown:#AC8E68;
  --warnink:#FF9F0A;--badink:#FF6961;--shadow:none;--shadow2:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.42 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-variant-numeric:tabular-nums;letter-spacing:-.006em}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--blue);text-decoration:none}
h1,h2,h3,p{margin:0}
code{font:12.5px var(--mono);background:var(--fill);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
pre{font:12.5px/1.55 var(--mono);background:var(--fill);padding:14px 16px;border-radius:12px;overflow:auto;color:var(--ink);margin:12px 0 0;white-space:pre-wrap}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 50%,transparent);outline-offset:2px}
[hidden]{display:none!important}

/* Kopf, Seiten */
.wrap{max-width:1180px;margin:0 auto;padding:30px 36px 72px}
.hd{margin-bottom:16px;min-height:62px;display:flex;align-items:flex-start;gap:12px}
.hdt{flex:1;min-width:0}
.hd h1{font:700 34px/1.08 var(--disp);letter-spacing:-.022em}
.hd p{margin-top:5px;color:var(--ink2);font-size:14px}
.page{display:none}.page.on{display:block;animation:ein .25s ease}
@keyframes ein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Navigation: am Rechner Seitenleiste, am Handy unten eine Leiste */
.side{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;padding:7px 4px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.tabbar>a{position:relative;flex:1 0 54px;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--ink2)}
.tabbar .i{width:25px;height:25px;stroke-width:1.8}
.tabbar{overflow-x:auto;scrollbar-width:none;justify-content:flex-start}.tabbar::-webkit-scrollbar{display:none}.tabbar>a{white-space:nowrap;font-size:10px}
.tabbar .on{color:var(--blue)}
.tabbar .badge{position:absolute;top:-5px;left:calc(50% + 4px)}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
@media (min-width:1000px){
  body{padding-bottom:0}
  .tabbar{display:none}
  #app{padding-left:250px}
  .side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:250px;z-index:30;padding:18px 12px 24px;overflow-y:auto;
    background:color-mix(in srgb,var(--card) 55%,var(--bg));border-right:.5px solid var(--sep)}
  .wrap{padding-top:34px}
}
.slogo{display:flex;align-items:center;gap:10px;padding:2px 10px 16px;font:700 20px var(--disp);letter-spacing:-.015em}
.side>a{display:flex;align-items:center;gap:10px;min-height:34px;padding:4px 10px;border-radius:8px;font-size:14.5px;color:var(--ink)}
.side>a:hover:not(.on){background:var(--hover)}
.side>a.on{background:var(--blue);color:#fff}
.side>a .sq{width:24px;height:24px;border-radius:6px}.side>a .sq .i{width:14px;height:14px}
.side>a .n{margin-left:auto;color:var(--ink2);font-size:13px}
.side>a.on .n{color:rgba(255,255,255,.85)}
.side>a .badge{margin-left:auto}
.side>a.on .badge{background:#fff;color:var(--blue)}
.side .grow{flex:1}
.side .wer{padding:10px;color:var(--ink2);font-size:12.5px}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}

/* Segmente */
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none;margin-bottom:18px}
.seg>button{display:flex;align-items:center;gap:6px;padding:6px 15px;border-radius:8px;font-size:13.5px;font-weight:500;white-space:nowrap}
.seg>button:hover:not(.on){background:var(--hover)}
.seg .on{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.seg .c{color:var(--ink2);font-weight:400}

/* Status und Symbole */
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink3);display:inline-block}
.dot.ok{background:var(--green)}.dot.warn{background:var(--orange)}.dot.bad{background:var(--red)}.dot.run{background:var(--blue)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--fill);color:var(--ink2);white-space:nowrap}
.chip.warn{background:color-mix(in srgb,var(--orange) 15%,transparent);color:var(--warnink)}
.chip.bad{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--badink)}
.chip.ok{background:color-mix(in srgb,var(--green) 15%,transparent);color:color-mix(in srgb,var(--green) 70%,var(--ink))}
.chip.run{background:color-mix(in srgb,var(--blue) 13%,transparent);color:var(--blue)}
.sq{--c:var(--blue);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c))}
.sq .i{width:17px;height:17px}
.sq.xl{width:46px;height:46px;border-radius:12px}.sq.xl .i{width:24px;height:24px}
.circ{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none}

/* Kacheln */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:8px}
.tile{display:flex;flex-direction:column;align-items:stretch;width:100%;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px 20px;transition:transform .18s,box-shadow .18s;min-width:0}
button.tile:hover{transform:translateY(-1px);box-shadow:var(--shadow2)}
.th{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600;margin-bottom:14px}
.big{font:600 32px/1 var(--round);letter-spacing:-.01em}
.big small{font:500 14px var(--font);color:var(--ink2);margin-left:5px;letter-spacing:0}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wrap{padding:22px 16px 60px}.hd h1{font-size:30px}}

/* Listen */
.gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font:600 20px/1.2 var(--disp);letter-spacing:-.012em;margin:30px 2px 10px}
.gh:first-child{margin-top:4px}
.gh span{font:400 14px var(--font);color:var(--ink2);letter-spacing:0}
.gh .btn{margin-left:auto;align-self:center}
.trhead{display:flex;flex-direction:row;align-items:center;gap:16px;margin-bottom:14px}
.trhead .t{flex:1}.trhead .big{font-size:28px}.trhead .muted{color:var(--ink2);font-size:13.5px}
.row>button.t{display:block;text-align:left;min-width:0}
.gh2{font-size:13px;font-weight:400;color:var(--ink2);margin:18px 16px 7px}
.grp{background:var(--grp);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:9px 14px;min-height:52px;position:relative;text-align:left;color:var(--ink)}
.row+.row::before{content:"";position:absolute;left:56px;right:0;top:0;height:.5px;background:var(--sep)}
.row.noi+.row::before,.row+.row.noi::before{left:16px}
button.row:hover{background:var(--hover)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:400;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t>span{display:block;color:var(--ink2);font-size:13px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t>span.ml{white-space:normal}
.row .v{color:var(--ink2);font-size:14px;white-space:nowrap;text-align:right}
.row.done .t b{color:var(--ink2);text-decoration:line-through}
.row.more .t b{color:var(--blue)}
.chev{color:var(--ink3);width:14px;height:14px;stroke-width:2.6;margin-left:-3px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:18px;padding:11px 16px;position:relative;font-size:15px}
.kv+.kv::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.kv>span{color:var(--ink2);text-align:right;min-width:0;overflow-wrap:anywhere;white-space:pre-line}
.note{color:var(--ink2);font-size:13px;margin:10px 16px 0;line-height:1.45}
.alt{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--orange) 14%,var(--grp));border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.alt .i{color:var(--orange);width:20px;height:20px;margin-top:1px}.alt b{display:block}
.btn.rot{color:var(--red)}
.empty{background:var(--grp);border-radius:14px;padding:26px 22px;color:var(--ink2);text-align:center;font-size:14.5px;box-shadow:var(--shadow)}
.empty b{color:var(--ink);font-weight:600;display:block;margin-bottom:2px}
.empty .i{width:28px;height:28px;display:block;margin:0 auto 8px;color:var(--ink3)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
/* Agenten: eine Karte je Agent */
.agk{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.agc{display:flex;flex-direction:column;gap:3px;width:100%;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;min-width:0;transition:transform .18s,box-shadow .18s}
.agc:hover{transform:translateY(-1px);box-shadow:var(--shadow2)}
.agc .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.agc .top b{font-weight:600;font-size:16px}.agc .top .chip{margin-left:auto}
.agc .was{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agc .klein{color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agc .unten{margin-top:6px;padding-top:8px;border-top:.5px solid var(--sep)}
.agc.pause .was{color:var(--ink2);font-weight:400}
.ava{--c:var(--blue);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 14px var(--round);flex:none;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c))}
.ava.xl{width:46px;height:46px;font-size:17px}
.balken{height:5px;border-radius:3px;background:var(--fill);margin-top:6px;overflow:hidden}.balken i{display:block;height:100%;border-radius:3px;background:var(--blue)}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink3);display:grid;place-items:center;flex:none;color:transparent}
.ck .i{width:14px;height:14px;stroke-width:3}
.ck.an{background:var(--green);border-color:var(--green);color:#fff}
.ck:hover:not(.an){border-color:var(--blue)}

/* Knöpfe und Eingaben */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14.5px;background:var(--fill);color:var(--blue);white-space:nowrap;transition:filter .15s,opacity .15s}
.btn .i{width:15px;height:15px}
.btn.pri{background:var(--blue);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{height:28px;padding:0 11px;font-size:13px;border-radius:8px}
.btn:hover:not(:disabled){filter:brightness(.96)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.inp{height:38px;border-radius:10px;border:0;background:var(--fill);padding:0 12px;font:inherit;font-size:15px;color:inherit;min-width:0;width:100%}
textarea.inp{height:auto;min-height:90px;padding:10px 12px;line-height:1.45;resize:vertical}
textarea.inp.lang{min-height:340px;font:13.5px/1.5 var(--mono)}
.inp:focus{outline:2px solid color-mix(in srgb,var(--blue) 55%,transparent)}
select.inp{padding-right:8px}
.form{display:flex;flex-direction:column;gap:10px;background:var(--grp);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.form .zeile{display:flex;gap:10px;flex-wrap:wrap}.form .zeile>*{flex:1 1 140px}
.form label{font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.suche{display:flex;align-items:center;gap:8px;height:40px;border-radius:11px;background:var(--fill);padding:0 12px;color:var(--ink2);margin-bottom:16px}
.suche input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none;min-width:0}

/* Blätter */
.veil{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.3);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.veil.open{opacity:1;visibility:visible}
.sheet{width:min(640px,100%);max-height:min(88vh,920px);display:flex;flex-direction:column;background:var(--sheet);border-radius:22px;box-shadow:0 24px 80px rgba(0,0,0,.3);
  transform:translateY(14px) scale(.98);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow:hidden;--grp:var(--grp2);--shadow:none}
.veil.open .sheet{transform:none}
.sh-head{display:flex;align-items:center;gap:14px;padding:20px 20px 14px;flex:none}
.sh-t{min-width:0;flex:1}
.sh-t h2{font:700 22px/1.15 var(--disp);letter-spacing:-.015em;overflow-wrap:anywhere}
.sh-t p{color:var(--ink2);font-size:13.5px;margin-top:2px}
.x{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink2);flex:none;align-self:flex-start}
.x .i{width:15px;height:15px;stroke-width:2.6}
.sh-body{overflow-y:auto;padding:0 20px 24px;overscroll-behavior:contain}
.sh-body>.gh2:first-child{margin-top:4px}
.acts{display:flex;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.acts .btn{flex:1;height:40px;background:var(--grp)}
.acts .btn.pri{background:var(--blue)}
@media (max-width:640px){.veil{padding:0;align-items:flex-end}.sheet{border-radius:18px 18px 0 0;max-height:94vh;width:100%}}


/* Berichte wie in der Zentrale des Vorbilds: links die Liste, rechts der Verlauf */
.be2{display:grid;grid-template-columns:340px minmax(0,1fr);background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;height:min(720px,calc(100vh - 200px));min-height:520px}
.bel{border-right:1px solid var(--sep);overflow:auto;background:color-mix(in srgb,var(--fill) 30%,transparent)}
.belk{padding:14px 16px 8px;display:flex;gap:8px;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1;background:var(--card)}.belk b{font-size:17px}.belk span{font-size:13px}
.ben{display:grid;grid-template-columns:10px 54px minmax(0,1fr);gap:0 10px;width:100%;text-align:left;padding:11px 14px 11px 8px;border-bottom:1px solid var(--sep);align-items:start}
.ben .pt{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:6px}.ben .pt.leer{background:none}
.beav{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}.beav svg{width:19px;height:19px}
.ben .t{min-width:0;display:flex;flex-direction:column}.ben .t b{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;font-weight:600}.ben .t b span{font-weight:400;color:var(--ink2);font-size:12.5px;flex:none}
.ben .t>span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink2);font-size:13px;margin-top:2px}
.befr{font-style:normal;display:inline-flex;width:max-content;align-items:center;gap:4px;margin-top:5px;font-size:12px;font-weight:600;color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent);border-radius:999px;padding:2px 8px}
.befr svg{width:13px;height:13px}.befr.ok{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.benr{font-size:14px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:1px;letter-spacing:-.01em}
.ben .t>span.bezl{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;overflow:visible;margin-top:0;-webkit-line-clamp:unset}.bezl .befr{margin-top:5px}
.beab{font-style:normal;display:inline-flex;width:max-content;max-width:100%;align-items:center;margin-top:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  --ab:var(--ink2);color:var(--ab);background:color-mix(in srgb,var(--ab) 14%,transparent)}
.beab.cx{--ab:#0C8A6B}.beab.cl{--ab:#B85A38}.beab.as{--ab:#2563EB}
@media (prefers-color-scheme:dark){.beab.cx{--ab:#4EE0B5}.beab.cl{--ab:#F0A17F}.beab.as{--ab:#8CC8FF}}
.bekn{display:block;font-size:11.5px;font-weight:650;color:var(--ink2);margin-bottom:2px;font-variant-numeric:tabular-nums}
.bem.ich.woanders{font-style:italic;opacity:.85}
.beck .btn{flex:none}
.belk{flex-wrap:wrap}.beproj{flex:1 1 100%;height:32px;font-size:13.5px;padding:0 8px;margin-top:2px}
.beab2{display:flex;align-items:center;gap:6px;margin:0;padding:12px 16px 6px;font:600 12.5px var(--font);color:var(--ink2);border-bottom:1px solid var(--sep)}
.beab2.warte{color:var(--orange)}.beab2 .i{width:14px;height:14px}
.bemehr{display:block;width:100%;padding:14px;color:var(--blue);font-size:14px;text-align:center}
.ben:hover{background:var(--hover)}.ben.on{background:color-mix(in srgb,var(--blue) 14%,transparent)}
.bec{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}

<div id="app" hidden>
  <nav class="side" id="side" aria-label="Bereiche"></nav>
  <div class="wrap"><main id="pages"></main></div>
  <nav class="tabbar" id="tabbar" aria-label="Bereiche"></nav>
</div>

<div class="toast" id="toast"></div>
<script>
"use strict";
const ICONS = /*ICONS*/{};

/* ---------- Werkzeuge ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = (k, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k] || ""}</svg>`;
const CHEV = icon("chevron-right", "i chev");
const sq = (ic, c, cls = "") => `<span class="sq ${cls}" style="--c:var(--${c})">${icon(ic)}</span>`;
const sh = spec => `data-sheet="${esc(spec)}"`;
const val = t => `<span class="v">${t}</span>`;
const chip = (t, c = "") => `<span class="chip ${c}">${esc(t)}</span>`;
function row(lead, title, sub, trail, act, cls = ""){
  const tag = act ? "button" : "div";
  return `<${tag} class="row${lead ? "" : " noi"}${cls ? " " + cls : ""}"${act ? ` type="button" ${act}` : ""}>${lead || ""}<span class="t"><b>${title}</b>${sub ? `<span>${sub}</span>` : ""}</span>${trail || ""}${act ? CHEV : ""}</${tag}>`;
}
const grp = rows => rows ? `<div class="grp">${rows}</div>` : "";
const gh = (t, sub) => `<h2 class="gh">${t}${sub ? `<span>${sub}</span>` : ""}</h2>`;
const gh2 = t => `<h3 class="gh2">${t}</h3>`;
const kv = (k, v) => v === "" || v == null ? "" : `<div class="kv">${k}<span>${v}</span></div>`;
const empty = (t, ic) => `<div class="empty">${ic ? icon(ic) : ""}${t}</div>`;
const note = t => `<p class="note">${t}</p>`;
const OPEN = new Set();
function more(key, items, n, fn){
  const all = OPEN.has(key), list = all ? items : items.slice(0, n);
  return list.map(fn).join("") + (items.length > n ? `<button class="row noi more" type="button" data-more="${esc(key)}"><span class="t"><b>${all ? "Weniger anzeigen" : `Alle ${items.length} anzeigen`}</b></span></button>` : "");
}
/* Sichtschutz: pv() markiert Beträge, beim Zeichnen wird daraus <span class="pv">, verdeckt bis zum Tipp aufs Auge (Finanzen).
   Die Marken überstehen esc(); in Attributen (title, value) werden sie entfernt. */
const PV0 = "", PV1 = "", pv = s => PV0 + s + PV1, pvWeg = s => String(s).replace(/[]/g, "");
const pvHtml = h => typeof h !== "string" || h.indexOf(PV0) < 0 ? h : h.replace(/<[^>]*>/g, t => pvWeg(t)).split(PV0).join('<span class="pv">').split(PV1).join("</span>");
let pvUhr = 0;
function pvSetzen(auf){
  document.body.classList.toggle("pv-zu", !auf);
  const t = auf ? "Beträge verbergen" : "Beträge zeigen";
  document.querySelectorAll("[data-pvknopf]").forEach(b => { b.innerHTML = icon(auf ? "eye" : "eye-off"); b.classList.toggle("pvauf", auf); b.setAttribute("aria-pressed", String(auf)); b.title = t; b.setAttribute("aria-label", t); });
  clearTimeout(pvUhr); if (auf) pvUhr = setTimeout(() => pvSetzen(false), 300000);
}
document.addEventListener("visibilitychange", () => { if (document.hidden) pvSetzen(false); });
function ring(p, c, inner, r = 42, w = 9){
  const C = 2 * Math.PI * r, L = Math.max(.5, Math.min(100, p || 0)) / 100 * C;
  return `<svg viewBox="0 0 100 100" class="ring" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--fill)" stroke-width="${w}"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--${c})" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${L.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 50 50)"/>${inner || ""}</svg>`;
}
const ringText = (v, u) => `<text x="50" y="57" text-anchor="middle">${esc(v)}${u ? `<tspan class="u" dx="2">${esc(u)}</tspan>` : ""}</text>`;
const stt = (st, t) => `<span class="st"><span class="dot ${st || ""}"></span>${esc(t)}</span>`;
const posHeute = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
/* Kündigungsfristen (aus finanzen.py): Abos, die bald gekündigt werden müssten; auf der Übersicht unter „Wartet auf dich“ */
const frBald = () => (D.fristen || []).filter(v => v.tage <= 7).length;
const frWann = v => v.tage === 0 ? "heute" : v.tage === 1 ? "morgen" : `in ${v.tage} Tagen`;
const FR_RHY = {monat: "im Monat", quartal: "im Quartal", jahr: "im Jahr", woche: "in der Woche"};
const frKarte = v => `<div class="hfrage"><button class="hfk" type="button" data-nav="finanzen"><span class="hfnr">⏰ Kündigen bis ${esc(fiTag(v.kuendbar_bis))} (${frWann(v)})</span>
  <span class="hft"><b>${pv(esc(v.name))}</b>${v.testphase_bis ? `: Testphase bis ${esc(fiTagLang(v.testphase_bis))},` : ","} danach ${esc(fiEur(v.betrag_cent))} ${FR_RHY[v.rhythmus] || ""}.</span></button>
  <div class="hfchips"><button class="bechip" type="button" data-frist="${esc(v.id)}|gekuendigt">Gekündigt</button><button class="bechip" type="button" data-frist="${esc(v.id)}|behalten">Behalten</button></div></div>`;
function setHtml(el, html){
  if (!el || el._h === html) return;
  const ae = document.activeElement;
  if (ae && el.contains(ae) && /^(SELECT|INPUT|TEXTAREA)$/.test(ae.tagName)) return;
  el.innerHTML = pvHtml(html); el._h = html;
}
function ago(t){
  if (!t) return "noch nie";
  const s = Math.max(0, Date.now()/1000 - t);
  if (s < 90) return "gerade eben";
  if (s < 3600) return `vor ${Math.round(s/60)} Min.`;
  if (s < 172800) return `vor ${Math.round(s/3600)} Std.`;
  return `vor ${Math.round(s/86400)} Tagen`;
}
const datum = d => d ? new Date(d + "T12:00:00").toLocaleDateString("de-DE") : "";
const heute = () => new Date().toISOString().slice(0, 10);
const wer = id => id === "besitzer" ? "Du" : id === "zentrale" ? "Zentrale" : id;
function toast(t){ const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("on"), 2200); }

/* Markdown wie in Obsidian: Überschriften, Listen, Aufgabenlisten, Tabellen, Fett, Kursiv, Code, Zitate, Links */
const mdStart = Z => { if (Z[0] && Z[0].trim() === "---") { const e = Z.findIndex((z, i) => i > 0 && z.trim() === "---"); if (e > 0) return e + 1; } return 0; };
function md(src){
  const Z = esc(src).replace(/\r\n/g, "\n").split("\n");
  const inl = t => t.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<i>$2</i>")
    .replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g, (m, z, a) => `<b>${a || z}</b>`)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const out = []; let liste = "", code = null, para = [], tab = [];
  const absatz = () => { if (para.length) { out.push(`<p>${inl(para.join(" "))}</p>`); para = []; } };
  const tabelle = () => { if (!tab.length) return;
    const zelle = z => z.trim().replace(/^\||\|$/g, "").split("|").map(c => inl(c.trim())), kopf = tab.length > 1 && /^[\s|:-]+$/.test(tab[1]);
    out.push(`<table>${kopf ? `<tr>${zelle(tab[0]).map(c => `<th>${c}</th>`).join("")}</tr>` : ""}${tab.slice(kopf ? 2 : 0).map(z => `<tr>${zelle(z).map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`); tab = []; };
  const zu = () => { absatz(); tabelle(); if (liste) { out.push(`</${liste}>`); liste = ""; } };
  const li = (art, html) => { absatz(); tabelle(); if (liste !== art) { if (liste) out.push(`</${liste}>`); out.push(`<${art}>`); liste = art; } out.push(html); };
  for (const z of Z.slice(mdStart(Z))) {
    let m;
    if (code !== null) { if (z.startsWith("```")) { out.push(`<pre>${code.join("\n")}</pre>`); code = null; } else code.push(z); continue; }
    if (z.startsWith("```")) { zu(); code = []; continue; }
    if (/^\s*\|.*\|\s*$/.test(z)) { absatz(); if (liste) { out.push(`</${liste}>`); liste = ""; } tab.push(z); continue; }
    tabelle();
    if ((m = z.match(/^(#{1,4})\s+(.*)/))) { zu(); out.push(`<h${m[1].length + 1}>${inl(m[2])}</h${m[1].length + 1}>`); continue; }
    if ((m = z.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/))) { li("ul", `<li class="cb${m[1] === " " ? "" : " an"}">${inl(m[2])}</li>`); continue; }
    if ((m = z.match(/^\s*[-*]\s+(.*)/))) { li("ul", `<li>${inl(m[1])}</li>`); continue; }
    if ((m = z.match(/^\s*\d+[.)]\s+(.*)/))) { li("ol", `<li>${inl(m[1])}</li>`); continue; }
    if ((m = z.match(/^&gt;\s?(.*)/))) { zu(); out.push(`<blockquote>${inl(m[1])}</blockquote>`); continue; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(z)) { zu(); out.push("<hr>"); continue; }
    if (!z.trim()) { zu(); continue; }
    if (liste) { out.push(`</${liste}>`); liste = ""; }
    para.push(z.trim());
  }
  if (code !== null) out.push(`<pre>${code.join("\n")}</pre>`);
  zu();
  return `<div class="mdx">${out.join("")}</div>`;
}

/* ---------- Eigene Fenster (Promise), nie alert/confirm/prompt ---------- */
function dialog(html, fokus){
  return new Promise(res => {
    const d = $("dlg"); d.innerHTML = `<div class="dlgbox">${html}</div>`; d.classList.add("open");
    const fertig = v => { d.classList.remove("open"); d.onclick = null; d.onkeydown = null; res(v); };
    d.onclick = e => { const b = e.target.closest("[data-dlg]"); if (b) fertig(b.dataset.dlg === "ok" ? (d.querySelector("input,textarea")?.value ?? true) : null); else if (e.target === d) fertig(null); };
    d.onkeydown = e => { if (e.key === "Escape") fertig(null); if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); fertig(e.target.value); } };
    setTimeout(() => (d.querySelector(fokus || "input,textarea") || d.querySelector("[data-dlg=ok]"))?.focus(), 50);
  });
}
const bestaetigen = (titel, text, knopf = "OK", rot = false) => dialog(`<div class="dlgk1"><div class="dlgtx"><b>${esc(titel)}</b>${text ? `<p>${esc(text)}</p>` : ""}</div><button type="button" data-dlg="ok" class="${rot ? "rot" : ""} fett">${esc(knopf)}</button></div><div class="dlgab"><button type="button" data-dlg="nein">Abbrechen</button></div>`).then(v => v !== null);
const meldung = (titel, text) => dialog(`<div class="dlgk1"><div class="dlgtx"><b>${esc(titel)}</b>${text ? `<p>${esc(text)}</p>` : ""}</div><button type="button" data-dlg="ok" class="fett">OK</button></div>`);
const eingeben = (titel, text, wert = "") => dialog(`<div class="dlgk1"><div class="dlgtx"><b>${esc(titel)}</b>${text ? `<p>${esc(text)}</p>` : ""}<input class="inp" value="${esc(wert)}"></div><button type="button" data-dlg="ok" class="fett">Fertig</button></div><div class="dlgab"><button type="button" data-dlg="nein">Abbrechen</button></div>`);

/* ---------- Schnittstelle: jede Abfrage trägt den Schlüssel des Besitzers ---------- */
let KEY = "";
try { KEY = localStorage.getItem("zentrale-schluessel") || ""; } catch(e) {}
async function api(pfad, body){
  const r = await fetch(pfad, {method: body ? "POST" : "GET", cache: "no-store", headers: {Authorization: "Bearer " + KEY, ...(body ? {"Content-Type": "application/json"} : {})}, body: body ? JSON.stringify(body) : undefined});
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { abmelden(); throw new Error("Schlüssel fehlt oder ist falsch."); }
  if (!r.ok) throw new Error(d.fehler || "Die Zentrale hat abgelehnt.");
  return d;
}
async function post(pfad, body){
  try { const d = await api(pfad, body); await laden(); return d; }
  catch(e) { meldung("Hat nicht geklappt", e.message); return null; }
}

/* ---------- Daten ---------- */
const FASSUNG = "2026-11-05";   // gleich wie hub.FASSUNG
const D = {pos: null, wuensche: null, berichte: null, notizen: null, agenten: null, laeufe: null, papierkorb: null, ich: null, fehler: ""};
async function laden(){
  if (!KEY) return;
  try {
    const [pos, wuensche, berichte, notizen, agenten, laeufe, ich] = await Promise.all(["/api/pos", "/api/wuensche", "/api/berichte", "/api/notizen", "/api/agenten", "/api/laeufe", "/api/ich"].map(p => api(p)));
    const papierkorb = await api("/api/papierkorb").catch(() => null);   // fehlt bei einer alten Zentrale
    D.fristen = (await api("/api/finanzen/fristen").catch(() => ({fristen: []}))).fristen;
    D.geraete = await api("/api/geraete").catch(() => null);   // fehlt bei einer Zentrale vor Fassung 2026-11-03
    laeufe._geholt = Date.now()/1000;
    Object.assign(D, {pos, wuensche, berichte, notizen, agenten, laeufe, ich, papierkorb, fehler: ""});
  } catch(e) { D.fehler = e.message; }
  renderAll();
}
const offeneFragen = b => b.fragen.filter(f => !f.antwort).length;
const projekt = id => (D.pos?.projekte || []).find(p => p.id === id);
const aufgabenVon = pid => (D.pos?.aufgaben || []).filter(a => a.projekt === pid);
const wunschZu = id => [...(D.wuensche?.offen || []), ...(D.wuensche?.erledigt || [])].find(w => w.id === id || String(w.nr) === String(id));
const PRIO = {hoch: ["Hoch", "red"], mittel: ["Mittel", "orange"], niedrig: ["Niedrig", "gray"], "": ["Ohne Priorität", "gray"]};

/* ---------- Seiten ---------- */
/* Leiste wie im Vorbild: oben das Tägliche, dann „Persönlich“ und „Homelab“ (Überschrift = gruppe) */
const PAGES = [
  {id: "uebersicht", title: "Übersicht", icon: "sun", farbe: "orange"},
  {id: "agenten", title: "Agenten", icon: "bot", farbe: "purple"},
  {id: "berichte", title: "Berichte", icon: "message-square-text", farbe: "green"},
  {id: "wuensche", title: "Wünsche", icon: "list-todo", farbe: "orange"},
  {id: "projekte", title: "Projekte", icon: "folder", farbe: "yellow", gruppe: "Persönlich"},
  {id: "finanzen", title: "Finanzen", icon: "wallet", farbe: "green", gruppe: "Persönlich"},
  {id: "notizen", title: "Notizen", icon: "notebook-pen", farbe: "indigo", gruppe: "Persönlich"},
  {id: "geraete", title: "Geräte", icon: "server", farbe: "blue", gruppe: "Homelab"},
  {id: "dienste", title: "Dienste", icon: "boxes", farbe: "indigo", gruppe: "Homelab", nurWenn: () => hlDienste().length > 0},
  {id: "netzwerk", title: "Netzwerk", icon: "network", farbe: "cyan", gruppe: "Homelab"},
  {id: "speicher", title: "Speicher", icon: "hard-drive", farbe: "gray", gruppe: "Homelab"},
  {id: "papierkorb", title: "Papierkorb", icon: "trash-2", farbe: "gray", gruppe: "Homelab"},
];
const sichtbar = () => PAGES.filter(p => !p.nurWenn || p.nurWenn() || p.id === PAGE);
let PAGE = "uebersicht";
const UI = {projektSicht: "aktiv", q: "", treffer: null, nordner: ""};
function zaehler(id){
  if (id === "wuensche") return D.wuensche ? D.wuensche.offen.length : "";
  if (id === "projekte") return D.pos ? D.pos.projekte.filter(p => p.status === "aktiv").length : "";
  if (id === "notizen") return D.notizen ? D.notizen.notizen.length : "";
  if (id === "papierkorb") return D.papierkorb ? (D.papierkorb.eintraege.length + D.papierkorb.notizen.length) || "" : "";
  if (id === "agenten") return D.laeufe ? D.laeufe.aktiv.filter(x => !x.still).length || "" : "";
  if (id === "geraete") return D.geraete ? D.geraete.geraete.length || "" : "";
  return "";
}
const fragenOffen = () => (D.berichte?.berichte || []).reduce((n, b) => n + offeneFragen(b), 0);
function renderNav(){
  const f = fragenOffen();
  let g0 = "";
  setHtml($("side"), `<div class="slogo">${sq("circle-dot", "blue")}Zentrale</div>` + sichtbar().map(p => { const h = (p.gruppe || "") !== g0 ? `<h4>${esc(p.gruppe)}</h4>` : ""; g0 = p.gruppe || "";
    const st = hlNavPunkt(p.id);
    return h + `<a href="#${p.id}" class="${p.id === PAGE ? "on" : ""}">${sq(p.icon, p.farbe)}${esc(p.title)}${p.id === "uebersicht" && f ? `<span class="badge">${f}</span>` : st ? `<span class="dot ${st}"></span>` : `<span class="n">${p.id === "berichte" ? (f ? `${f} ${f === 1 ? "Frage" : "Fragen"}` : "") : zaehler(p.id)}</span>`}</a>`; }).join("")
    + `<div class="grow"></div><div class="wer">Angemeldet als Besitzer · <a href="#" data-act="abmelden">Abmelden</a><br>Fassung ${esc(FASSUNG)}<br><a href="https://github.com/hadi-yousef/zentrale-starter" target="_blank" rel="noopener">Zentrale Starter</a> von Hadi Yousef · Apache-2.0</div>`);
  setHtml($("tabbar"), sichtbar().map(p => `<a href="#${p.id}" class="${p.id === PAGE ? "on" : ""}">${icon(p.icon)}${esc(p.title)}${p.id === "uebersicht" && f ? `<span class="badge">${f}</span>` : ""}</a>`).join(""));
}
function kopf(titel, sub, knopf){ return `<div class="hd"><div class="hdt"><h1>${esc(titel)}</h1>${sub ? `<p>${sub}</p>` : ""}</div>${knopf || ""}</div>`; }

/* Übersicht wie „Heute“ im Vorbild: links was auf dich wartet und deine Aufgaben, rechts die Agenten und Zahlen zum Antippen */
const th = (ic, c, t, extra = "") => `<span class="th">${sq(ic, c, "sm")}${t}${extra}</span>`;
const tagHeute = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const posTage = f => Math.round((new Date(f + "T12:00") - new Date(tagHeute() + "T12:00")) / 864e5);
function posFaellig(a){
  if (!a.faellig) return "";
  const t = posTage(a.faellig), d = new Date(a.faellig + "T12:00").toLocaleDateString("de-DE", {day: "numeric", month: "short"});
  return t < 0 ? `überfällig seit ${d}` : t === 0 ? "heute fällig" : t === 1 ? "morgen fällig" : `fällig ${d}`;
}
/* Offene Aufgaben: Überfälliges und Heutiges zuerst, dann nach Datum, dann ohne Datum in der Reihenfolge des Anlegens */
const posSort = (a, b) => (a.faellig ? posTage(a.faellig) : 1e9) - (b.faellig ? posTage(b.faellig) : 1e9) || a.erstellt - b.erstellt;
const posWer = v => v === "besitzer" ? "dich" : v;
function posZeile(a, mitProjekt = true){
  const p = projekt(a.projekt), f = posFaellig(a), spaet = a.faellig && !a.erledigt && posTage(a.faellig) <= 0;
  const sub = [mitProjekt && p ? p.name : "", a.erledigt ? `erledigt ${ago(a.erledigt)}${a.erledigt_von && a.erledigt_von !== "besitzer" ? " von " + posWer(a.erledigt_von) : ""}` : f, a.fuer !== "besitzer" && !a.erledigt ? `für ${posWer(a.fuer)}` : ""].filter(Boolean).join(" · ");
  return `<div class="row posa${a.erledigt ? " wfertig" : ""}"><button class="wkb" type="button" data-act="abhaken" data-id="${esc(a.id)}" aria-label="${a.erledigt ? "Wieder öffnen" : "Erledigt"}">${a.erledigt ? `<span class="wk ok">${icon("check")}</span>` : `<span class="wk"></span>`}</button>
    <span class="t"><b class="${a.erledigt ? "durch" : ""}">${esc(a.titel)}</b>${sub ? `<span class="${spaet ? "spaet" : ""}">${esc(sub)}</span>` : ""}</span></div>`;
}
const aufgabeZeile = a => posZeile(a);
function posNeuForm(projektId){
  const P = (D.pos?.projekte || []).filter(p => p.status === "aktiv");
  return `<form class="posform" data-form="aufgabe"${projektId ? ` data-projekt="${esc(projektId)}"` : ""}><input class="inp" name="titel" placeholder="Neue Aufgabe …" autocomplete="off" maxlength="200" aria-label="Neue Aufgabe" required>
    ${projektId ? "" : `<select class="inp" name="projekt" aria-label="Projekt"><option value="">Ohne Projekt</option>${P.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select>`}
    <input class="inp" type="date" name="faellig" aria-label="Fällig am"><button class="btn pri sm">Eintragen</button></form>`;
}
const fuerMich = () => (D.pos?.aufgaben || []).filter(a => !a.erledigt && a.fuer === "besitzer").sort(posSort);
function ueWartet(){
  const kopf = th("message-circle-question", "orange", "Wartet auf dich", `<button class="lnk" type="button" data-nav="berichte">Alle Berichte</button>`);
  const B = beAlle().filter(b => offeneFragen(b)).sort((a, b) => a.zeit - b.zeit), F = (D.fristen || []).filter(v => v.tage <= 14).map(frKarte).join("");
  if (!B.length) return `<div class="tile">${kopf}${F}${F ? "" : `<p class="muted hruhig">${icon("circle-check")}Keine offenen Fragen. Neue Berichte kommen unter Berichte.</p>`}</div>`;
  return `<div class="tile">${kopf}${F}${B.slice(0, 4).map(b => { const f = b.fragen.find(x => !x.antwort);
    return `<div class="hfrage"><button class="hfk" type="button" data-act="beoeffnen" data-id="${esc(b.id)}"><span class="hfnr">Bericht Nr. ${b.nr}${b.projekt ? " · " + esc(b.projekt) : ""}</span><span class="hft">${esc(f.text)}</span></button>
      <div class="hfchips">${f.vorschlaege.map(v => `<button class="bechip" type="button" data-act="bechip" data-id="${esc(b.id)}" data-frage="${esc(f.id)}" data-wert="${esc(v)}">${esc(v)}</button>`).join("")}<button class="bechip hfeig" type="button" data-act="beoeffnen" data-id="${esc(b.id)}">${f.vorschlaege.length ? "Eigene Antwort" : "Antworten"}</button></div></div>`; }).join("")}
    ${B.length > 4 ? `<span class="foot"><button class="btn sm" type="button" data-nav="berichte">${B.length - 4} weitere in Berichte</button><span></span></span>` : ""}</div>`;
}
function viewUebersicht(){
  const K = fuerMich(), h = new Date().getHours(), n = fragenOffen() + frBald();
  const datum = new Date().toLocaleDateString("de-DE", {weekday: "long", day: "numeric", month: "long"});
  const tag = `<div class="tile">${th("calendar-days", "red", "Heute", `<button class="lnk" type="button" data-nav="projekte">Projekte</button>`)}
    <div class="posliste">${K.length ? K.slice(0, 6).map(a => posZeile(a)).join("") : `<p class="muted hleer">Für dich ist gerade nichts offen.</p>`}</div>
    ${K.length > 6 ? `<p class="muted hleer"><button class="lnk" type="button" data-nav="projekte">und ${K.length - 6} weitere unter Projekte</button></p>` : ""}
    <span class="foot hneu">${posNeuForm()}</span></div>`;
  const A = agAlle();
  const ag = `<div class="tile">${th("bot", "purple", "Agenten", `<button class="lnk" type="button" data-nav="agenten">Alle</button>`)}
    ${A.length ? A.slice(0, 4).map(a => { const x = a.aktiv[0], [zt, zc] = agZustand(a); return row(ava(a.id), esc(a.id), x ? esc(lTitel(x)) : "zuletzt da " + esc(ago(a.zuletzt)), chip(zt, zc), sh("agent:" + a.id)); }).join("")
      : `<p class="muted hleer">Noch kein Agent. Anlegen mit <code>py start.py agent-neu claude</code>.</p>`}</div>`;
  const zahl = (ic, c, z, l, nav) => `<button class="tile hzahl" type="button" data-nav="${nav}">${sq(ic, c, "sm")}<b>${z}</b><span>${l}</span></button>`;
  const P = (D.pos?.projekte || []).filter(p => p.status === "aktiv").length, W = D.wuensche?.offen.length || 0, AO = (D.pos?.aufgaben || []).filter(a => !a.erledigt).length, N = D.notizen?.notizen.length || 0;
  const zahlen = `<div class="hzahlen vier">${zahl("list-todo", "orange", W, W === 1 ? "Wunsch offen" : "Wünsche offen", "wuensche")}${zahl("folder", "yellow", P, "Projekte aktiv", "projekte")}${zahl("list-checks", "green", AO, AO === 1 ? "Aufgabe offen" : "Aufgaben offen", "projekte")}${zahl("notebook-pen", "indigo", N, N === 1 ? "Notiz" : "Notizen", "notizen")}</div>`;
  return kopf(h < 11 ? "Guten Morgen" : h < 18 ? "Guten Tag" : "Guten Abend", `${esc(datum)} · ${n ? `${n} ${n === 1 ? "Sache wartet" : "Sachen warten"} auf dich` : `${K.length} ${K.length === 1 ? "Aufgabe" : "Aufgaben"} für dich`}`)
    + `<div class="hgrid"><div class="hcol">${ueWartet()}${tag}</div><div class="hcol">${ag}${ueHomelab()}${zahlen}</div></div>`;
}

/* Agenten: wer gerade woran arbeitet (Läufe aus laeufe.py), was zuletzt fertig wurde */
const AG_FARBE = {claude: "purple", codex: "blue"}, AG_REST = ["teal", "pink", "indigo", "mint", "orange", "brown", "cyan", "green"];
function agFarbe(id){ if (AG_FARBE[id]) return AG_FARBE[id]; let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AG_REST[h % AG_REST.length]; }
const agKurz = id => ({claude: "Cl", codex: "Cx"})[id] || (id.slice(0, 1).toUpperCase() + id.slice(1, 2));
const ava = (id, cls = "") => `<span class="ava ${cls}" style="--c:var(--${agFarbe(id)})">${esc(agKurz(id))}</span>`;
function dauer(s){ s = Math.max(0, s); return s < 90 ? "1 Min." : s < 5400 ? `${Math.round(s/60)} Min.` : s < 172800 ? `${Math.round(s/3600)} Std.` : `${Math.round(s/86400)} Tagen`; }
const lJetzt = () => D.laeufe?.jetzt ? D.laeufe.jetzt + (Date.now()/1000 - D.laeufe._geholt) : Date.now()/1000;
const lKey = x => `${x.agent}|${x.lauf}|${x.ende || ""}`;
const lWunsch = x => x.wunsch ? wunschZu(x.wunsch) : null;
const lTitel = x => x.titel || (lWunsch(x)?.titel) || (x.lauf.startsWith("chat-") ? "Chat" : x.lauf);
const LSTAT = {fertig: ["check", "green", "Fertig"], fehler: ["triangle-alert", "red", "Fehler"], abgebrochen: ["x", "gray", "Abgebrochen"]};
function agAlle(){
  const L = D.laeufe || {aktiv: [], fertig: []}, ids = (D.agenten?.agenten || []).map(a => a.id).filter(i => i !== "besitzer");
  for (const x of [...L.aktiv, ...L.fertig]) if (!ids.includes(x.agent)) ids.push(x.agent);
  return ids.map(id => {
    const aktiv = L.aktiv.filter(x => x.agent === id).sort((a, b) => b.t - a.t);
    return {id, aktiv, fertig: L.fertig.filter(x => x.agent === id), zuletzt: (D.agenten?.agenten || []).find(a => a.id === id)?.zuletzt};
  }).sort((a, b) => (b.aktiv.length > 0) - (a.aktiv.length > 0) || a.id.localeCompare(b.id));
}
function agZustand(a){
  const x = a.aktiv[0];
  if (!x) return ["Pause", ""];
  return x.still ? ["still", "warn"] : ["arbeitet", "ok"];
}
function agKarte(a){
  const x = a.aktiv[0], [zt, zc] = agZustand(a), f = a.fertig[0], jetzt = lJetzt();
  const kopf = `<div class="top">${ava(a.id)}<b>${esc(a.id)}</b>${chip(zt, zc)}</div>`;
  const mitte = x
    ? `<div class="was">${esc(lTitel(x))}</div><div class="klein">${[x.wunsch ? `Wunsch Nr. ${x.wunsch}` : "", "seit " + dauer(jetzt - x.start), a.aktiv.length > 1 ? `+${a.aktiv.length - 1} weitere` : ""].filter(Boolean).join(" · ")}</div>`
      + (x.fortschritt != null ? `<div class="balken"><i style="width:${Math.round(x.fortschritt)}%"></i></div>` : "")
      + (x.schritt ? `<div class="klein">${esc(x.schritt)}</div>` : "")
    : `<div class="was">Macht gerade nichts</div><div class="klein">zuletzt da ${esc(ago(a.zuletzt))}</div>`;
  const unten = `<div class="klein unten">${f ? `Zuletzt fertig: ${esc(lTitel(f))} · ${esc(ago(f.ende))}` : "Noch nichts fertig gemeldet"}</div>`;
  return `<button type="button" class="agc${x ? "" : " pause"}" ${sh("agent:" + a.id)}>${kopf}${mitte}${unten}</button>`;
}
function laufZeile(x){
  const [ic, c] = LSTAT[x.status] || LSTAT.fertig;
  return row(sq(ic, c), (x.wunsch ? `Wunsch Nr. ${x.wunsch} · ` : "") + esc(lTitel(x)), esc(x.agent) + (x.ergebnis ? " · " + esc(x.ergebnis) : ""), val(esc(ago(x.ende))), sh("lauf:" + lKey(x)));
}
function viewAgenten(){
  const A = agAlle(), dran = A.filter(a => a.aktiv.some(x => !x.still)).length, F = D.laeufe?.fertig || [];
  const heute0 = new Date().setHours(0, 0, 0, 0) / 1000, heuteF = F.filter(x => x.ende >= heute0 && x.status === "fertig").length;
  return kopf("Agenten", `${dran} dran · ${heuteF} heute fertig`)
    + (A.length ? `<div class="agk">${A.map(agKarte).join("")}</div>` : empty("<b>Noch kein Agent</b>Anlegen mit <code>py start.py agent-neu claude</code> und <code>py start.py agent-neu codex</code>", "bot"))
    + gh("Fertig gemeldet", F.length ? `${F.length}, das neueste oben` : "")
    + (F.length ? grp(more("lf", F, 8, laufZeile)) : empty("<b>Noch nichts fertig gemeldet</b>Claude meldet sich über den Hook von selbst, Codex mit <code>lauf start</code> und <code>lauf fertig</code>.", "check"));
}
function laufAngaben(x){
  const w = lWunsch(x), jetzt = lJetzt();
  return grp(kv("Agent", esc(x.agent))
    + (x.wunsch ? `<button type="button" class="kv" style="width:100%" ${w ? sh("wunsch:" + w.id) : ""}>Wunsch<span>Nr. ${x.wunsch}${w ? " · " + esc(w.titel) : ""}</span></button>` : "")
    + kv("Angefangen", esc(new Date(x.start * 1000).toLocaleString("de-DE", {dateStyle: "short", timeStyle: "short"})))
    + kv(x.ende ? "Dauer" : "Läuft seit", esc(dauer((x.ende || jetzt) - x.start)))
    + (x.fortschritt != null ? kv("Fortschritt", Math.round(x.fortschritt) + " %") : "")
    + kv("Letzter Schritt", esc(x.schritt)) + kv("Gemeldet über", esc({hook: "Hook (von selbst)", hand: "Befehl lauf"}[x.quelle] || x.quelle)));
}
/* Projekte als Karten wie im Vorbild: Symbol, Ort, „Als Nächstes“, Fortschritt. Darunter Aufgaben ohne Projekt, Ruht, Archiv */
const POS_SYMBOLE = ["folder", "layout-dashboard", "sparkles", "film", "palette", "zap", "globe", "server", "mic", "cpu", "gamepad-2", "book-open", "code", "camera",
  "music", "house", "car", "heart", "briefcase", "graduation-cap", "wrench", "smartphone", "image", "bot", "rocket", "leaf", "monitor", "printer", "flask-conical", "broom"];
const posSym = n => POS_SYMBOLE.includes(n) ? n : "folder";
function posKarte(p){
  const A = aufgabenVon(p.id), offen = A.filter(a => !a.erledigt).length, pc = A.length ? Math.round(100 * (A.length - offen) / A.length) : 0, c = p.farbe || "gray";
  return `<button class="card" type="button" ${sh("projekt:" + p.id)}><span class="top">${sq(posSym(p.symbol), c, "xl")}<span class="t"><b>${esc(p.name)}</b><span>${esc((p.orte || []).map(o => o.geraet).filter((v, i, x) => v && x.indexOf(v) === i).join(", ") || "Ort noch offen")}</span></span></span>
    ${p.naechster_schritt ? `<p><b>Als Nächstes:</b> ${esc(p.naechster_schritt)}</p>` : `<p>${esc(p.beschreibung)}</p>`}
    <span class="posbar"><i style="width:${pc}%;background:var(--${c})"></i></span><span class="bot"><span>${offen ? `${offen} ${offen === 1 ? "Aufgabe" : "Aufgaben"} offen` : A.length ? "alles erledigt" : "noch keine Aufgaben"}</span><span>${A.length ? pc + " % erledigt" : ""}</span></span></button>`;
}
function viewProjekte(){
  const P = D.pos?.projekte || [], G = st => P.filter(p => p.status === st).sort((a, b) => b.geaendert - a.geaendert);
  const listRow = p => { const offen = aufgabenVon(p.id).filter(a => !a.erledigt).length; return row(sq(posSym(p.symbol), p.farbe || "gray"), esc(p.name), esc(p.naechster_schritt || p.beschreibung), val(offen ? `${offen} offen` : ""), sh("projekt:" + p.id)); };
  const lose = (D.pos?.aufgaben || []).filter(a => !a.projekt && !a.erledigt).sort(posSort), K = fuerMich().length;
  return kopf("Projekte", `${K} ${K === 1 ? "Aufgabe" : "Aufgaben"} für dich, ${G("aktiv").length} aktive Projekte`)
    + gh("Aktiv", `${G("aktiv").length}, zuletzt bearbeitet zuerst`) + (G("aktiv").length ? `<div class="cards">${G("aktiv").map(posKarte).join("")}</div>` : empty("<b>Noch keine Projekte</b>Dein Agent trägt sie nach der Bestandsaufnahme ein.", "folder"))
    + (lose.length ? gh("Ohne Projekt", `${lose.length} offen`) + grp(lose.map(a => posZeile(a, false)).join("")) : "")
    + (G("ruht").length ? gh("Ruht", `${G("ruht").length}, wartet auf deine Entscheidung oder einen Anlass`) + grp(G("ruht").map(listRow).join("")) : "")
    + (G("archiv").length ? gh("Archiv", G("archiv").length) + grp(more("posarch", G("archiv"), 5, listRow)) : "")
    + gh("Neues Projekt") + `<form class="grp posform" data-form="projektschnell"><input class="inp" name="name" placeholder="Name des Projekts …" autocomplete="off" maxlength="80" aria-label="Name des Projekts" required><button class="btn pri sm">Anlegen</button></form>`
    + note("Antippen öffnet ein Projekt mit allen Aufgaben. Deine Agenten sehen dieselben Projekte und tragen ihre Schritte selbst ein.");
}

/* Verlauf: Bericht-Karte, dann die Fragen nacheinander (die nächste erst nach der Antwort), dazwischen freie Nachrichten nach Zeit */

document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches("[data-betext]")) BER.text[t.dataset.betext] = t.value;
  else if (WX.edit && t.matches("[data-wxta]")) WX.edit.text = t.value;
  else if (WX.edit && t.matches("[data-wxtitel]")) WX.edit.titel = t.value;
  else if (t.id === "wxq") wxSuchen(t.value);
});
document.addEventListener("keydown", e => {
  if (WX.edit && (e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); wxSpeichern(document.querySelector("[data-act=wxspeichern]")); return; }
  if (e.key === "Escape" && WX.ordnerForm && e.target.closest && e.target.closest('[data-form="wxordner"]')) { WX.ordnerForm = false; e.target.blur(); wxZeichnen(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.target.matches("[data-betext]")) { e.preventDefault(); e.target.form.requestSubmit(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && SHEET && !$("dlg").classList.contains("open")) closeSheet(); });

/* ---------- Anmelden und Seiten wechseln ---------- */
function zeigeLogin(fehler){
  $("app").hidden = true; $("login").hidden = false;
  $("login").innerHTML = `${sq("key-round", "blue", "xl")}<h1>Zentrale</h1><p>Gib den Schlüssel ein, den <code>py start.py</code> beim ersten Start angezeigt hat. Der Browser merkt ihn sich.</p>
    <form data-form="login"><input class="inp" type="password" name="schluessel" placeholder="Schlüssel" autocomplete="current-password" required><button class="btn pri" type="submit">Anmelden</button></form>${fehler ? note(esc(fehler)) : ""}`;
}
async function anmelden(s){
  KEY = (s || "").trim();
  try { const d = await api("/api/ich"); if (!d.besitzer) throw new Error("Das ist der Schlüssel eines Agenten. Hier bitte den Schlüssel des Besitzers."); }
  catch(e) { KEY = ""; return zeigeLogin(e.message); }
  try { localStorage.setItem("zentrale-schluessel", KEY); } catch(e) {}
  start();
}
function abmelden(){ KEY = ""; try { localStorage.removeItem("zentrale-schluessel"); } catch(e) {} closeSheet(); zeigeLogin(); }
function route(){ const h = location.hash.slice(1); if (h !== PAGE) UI.nordner = ""; PAGE = VIEWS[h] ? h : "uebersicht"; closeSheet(); renderAll(); scrollTo(0, 0); }
let timer = 0;
function start(){
  $("login").hidden = true; $("app").hidden = false;
  route(); laden(); clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) laden(); }, 10000);
}
addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (!document.hidden && KEY) laden(); });
addEventListener("error", e => { window.__fehler = (window.__fehler || "") + e.message + " "; });
KEY ? start() : zeigeLogin();
</script>
